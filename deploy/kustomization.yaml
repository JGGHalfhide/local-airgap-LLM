# Inference endpoint, synced by the Argo CD Application `local-airgap-llm` in
# platform-lab's root app. Two parts, because Grafana's dashboard sidecar
# only watches the monitoring namespace:
#   llm/         namespace llm: server, Service, NetworkPolicies, ServiceMonitor
#   monitoring/  Grafana dashboard ConfigMap in the monitoring namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - llm
  - monitoring

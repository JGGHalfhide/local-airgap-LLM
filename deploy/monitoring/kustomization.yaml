# Grafana dashboards as ConfigMaps labelled grafana_dashboard in the
# monitoring namespace, loaded by Grafana's sidecar into the
# "local-airgap-llm" folder. The JSON is generated by
# scripts/gen-dashboard.py; edit the script, not the JSON.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      app.kubernetes.io/part-of: local-airgap-llm
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: local-airgap-llm
configMapGenerator:
  - name: dashboard-llama-server
    files:
      - dashboards/llama-server.json

# The inference pods make no outbound connections at all: the model comes
# from the image volume (pulled by the kubelet, not the pod) and the server
# needs no DNS. Inbound only from the KEDA HTTP add-on's interceptor, which
# is where clients connect (scaling.yaml; platform-lab limits the
# interceptor to pods and namespaces labelled
# inference.local-airgap-llm/client=true), and from Prometheus for /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-server-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app.kubernetes.io/name: http
              app.kubernetes.io/instance: interceptor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080

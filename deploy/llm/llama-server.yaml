# llama-server (ADR 0001) serving Qwen3.5 4B Q4_K_M (ADR 0002), the model
# mounted read-only from its signed OCI image (ADR 0003). OpenAI-compatible
# API and Prometheus metrics on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  labels:
    app.kubernetes.io/name: llama-server
spec:
  # No replicas: KEDA owns the count (scaling.yaml, 0 or 1).
  # One replica on one node: a second copy would not fit next to the first
  # during a rolling update, so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          # ghcr.io/ggml-org/llama.cpp:server-v1.0.0-b12359-b1b770d (llama.cpp
          # v1.0.0, commit b1b770d9), published and signed by make image.
          image: 127.0.0.1:30500/ggml-org/llama.cpp@sha256:e3032ea0712da96dec820c770626385de4322dd06619fb5829256a504bbc9375
          # llama-server v1.0 does not take --flag=value: flag and value
          # are separate arguments.
          args:
            - --model
            - /models/Qwen3.5-4B-Q4_K_M.gguf
            - --alias
            - qwen3.5-4b
            - --jinja
            # No mmap: peak memory 3.9 GiB instead of 5.1 at 8k context;
            # 4.6 GiB at 32k (benchmarks/README.md).
            - --load-mode
            - none
            # 32k tokens shared by 4 slots (unified KV cache): one long
            # request can use all of it (docs/resource-plan.md).
            - --ctx-size
            - "32768"
            # No RAM prompt cache. It saves the state of every prompt that
            # leaves a slot, up to 8 GiB by default: under load (4 slots,
            # unique prompts) the pod passed its 6 GiB limit and was
            # OOMKilled. Off, peak is 5.0 GiB. Each slot still reuses its
            # own KV prefix (docs/load-test.md).
            - --cache-ram
            - "0"
            # Thinking off unless a request opts in with
            # chat_template_kwargs {"enable_thinking": true}, and then at most
            # 1024 thinking tokens (ADR 0006). Qwen3.5 thinks by default:
            # 15-45 s per short answer here, and open-ended questions looped
            # for 8k tokens (10 min) with no answer.
            - --reasoning
            - "off"
            - --reasoning-budget
            - "1024"
            # 6 threads for generation, 8 for prompt processing: best
            # results of the in-cluster benchmark on 8 vCPU.
            - --threads
            - "6"
            - --threads-batch
            - "8"
            - --metrics
            - --no-webui
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          # /health answers 503 while the model loads, 200 once ready.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # CPU request 4, not the 6 threads it runs: the platform already
          # requests 2.75 of 8 CPUs. No CPU limit, so idle cores are used.
          resources:
            requests:
              cpu: "4"
              memory: 5Gi
            limits:
              # Measurement 11/24 (local-agents agent-tool-loop OOM): 7.5 GiB
              # with 4 slots, replay of scripts/agent-mem-replay.py. Not final.
              memory: 7680Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: model
          # models/qwen3.5-4b-q4km:hf-8d43d974efc4, built and signed by
          # make model (docs/model-image.md).
          image:
            reference: 127.0.0.1:30500/models/qwen3.5-4b-q4km@sha256:fb1e513b3791251de054a3f1682f9b5d58751664a1cdfbc451185abfb235bd61
            pullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  labels:
    app.kubernetes.io/name: llama-server
spec:
  selector:
    app.kubernetes.io/name: llama-server
  ports:
    - name: http
      port: 8080
      targetPort: http

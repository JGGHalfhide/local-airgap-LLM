# The llm namespace: llama-server Deployment + Service (ADR 0004),
# NetworkPolicies and the ServiceMonitor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
labels:
  - pairs:
      app.kubernetes.io/part-of: local-airgap-llm
resources:
  - namespace.yaml
  - llama-server.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
